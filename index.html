<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101d">
  <meta name="description" content="运行一行代码，送出一份闪闪发光的生日祝福。">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:title" content="生辰喜乐 · 一行生日代码">
  <meta property="og:description" content="送你一块会旋转的星空蛋糕。点开许个愿吧。">
  <title>生辰喜乐 · 一行生日代码</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #10101d;
      --paper: #fff0d7;
      --muted: #b3a5bd;
      --faint: #80748f;
      --line: #383047;
      --gold: #f4c895;
      --lavender: #bd9be2;
      --serif: 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'SimSun', serif;
      --sans: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --mono: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: radial-gradient(ellipse at 73% 38%, #292148 0%, transparent 51%), var(--ink); color: var(--paper); font-family: var(--sans); }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--lavender); outline-offset: 5px; }
    [hidden] { display: none !important; }
    .shell { width: min(1240px, 100% - 96px); margin-inline: auto; }
    .masthead, .footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .masthead { min-height: 86px; border-bottom: 1px solid var(--line); }
    .identity { display: flex; align-items: center; gap: 11px; font: 600 12px var(--mono); letter-spacing: .18em; }
    .identity svg { width: 25px; height: 25px; color: var(--gold); }
    .edition, .footer { color: var(--muted); font: 11px var(--mono); letter-spacing: .12em; }
    .card { min-height: min(675px, calc(100svh - 154px)); display: grid; grid-template-columns: minmax(315px, .77fr) minmax(0, 1.23fr); gap: clamp(26px, 5vw, 72px); align-items: center; padding-block: 48px; }
    .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; color: var(--gold); font: 11px var(--mono); letter-spacing: .19em; }
    .eyebrow::before { content: ''; width: 26px; height: 1px; background: currentColor; }
    .lead { container-type: inline-size; }
    h1 { margin: 0; font: 600 clamp(35px, 17.1cqw, 91px)/1.13 var(--serif); letter-spacing: .035em; }
    h1 span { display: block; color: var(--gold); }
    .intro { margin: 24px 0 30px; color: var(--muted); font-size: clamp(13px, 1.15vw, 16px); line-height: 1.85; }
    .terminal { width: min(100%, 430px); border: 1px solid var(--line); background: #171525; border-radius: 12px; }
    .terminal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font: 10px var(--mono); letter-spacing: .12em; }
    .terminal-lights { display: flex; gap: 5px; }
    .terminal-lights i { width: 5px; height: 5px; border-radius: 50%; background: #77658a; }
    .terminal-lights i:first-child { background: var(--gold); }
    .command { display: flex; align-items: baseline; gap: 9px; min-height: 62px; padding: 21px 15px 20px; font: clamp(12px, 1.38vw, 16px)/1.25 var(--mono); }
    .prompt-symbol { color: var(--lavender); }
    .code { color: #f5dcbe; overflow-wrap: anywhere; }
    .caret { display: inline-block; width: 6px; height: 1em; margin-left: 3px; vertical-align: -.14em; background: var(--gold); animation: blink 1.15s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .actions { margin-top: 25px; min-height: 50px; display: flex; align-items: center; gap: 14px; }
    .action { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 49px; padding: 0 18px; border: 1px solid transparent; border-radius: 7px; background: var(--gold); color: #261926; font-weight: 700; font-size: 14px; cursor: pointer; transition: background .2s, transform .2s; }
    .action:hover { background: #ffdbb2; transform: translateY(-2px); }
    .action:active { transform: translateY(0); }
    .action svg { width: 15px; height: 15px; }
    .action.replay { color: var(--gold); background: transparent; border-color: #67536d; }
    .action.replay:hover { background: #292136; }
    .shortcut { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
    .shortcut kbd { font: inherit; border: 1px solid #51455f; border-radius: 4px; padding: 3px 5px; }
    .stage { isolation: isolate; position: relative; width: 100%; aspect-ratio: 1.11; min-height: 0; overflow: hidden; border: 1px solid #675182; border-radius: 17px; background: #090914; box-shadow: 0 0 38px #7c56c62b, 0 16px 70px #05061085; cursor: grab; touch-action: pan-y; }
    .stage:focus-visible { outline: 2px solid var(--lavender); outline-offset: 4px; }
    .stage[data-dragging] { cursor: grabbing; }
    .frame-label { position: absolute; z-index: 3; display: flex; align-items: center; gap: 8px; color: #cbbbd0; font: 10px var(--mono); letter-spacing: .12em; pointer-events: none; }
    .frame-label.top { top: 23px; left: 23px; }
    .frame-label.right { top: 23px; right: 23px; color: #b79dc0; }
    .frame-label.bottom { bottom: 23px; left: 23px; }
    .frame-label.guide { bottom: 23px; right: 23px; }
    .frame-label.bottom b { color: var(--gold); font-weight: 500; }
    .indicator { width: 6px; height: 6px; border: 1px solid var(--lavender); border-radius: 50%; }
    .card:is([data-stage="candle"], [data-stage="finale"]) .indicator { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 11px var(--gold); }
    .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
    #cake-scene { transform-origin: center 4%; transition: transform .6s ease; }
    .card[data-stage="finale"] #cake-scene { transform: scale(.82); }
    #fireworks { z-index: 1; }
    .wordmark { position: absolute; z-index: 2; inset: auto 16px max(5.5%, 34px); margin: 0; color: #fff9e8; text-align: center; font: italic clamp(25px, 4vw, 55px)/1.05 'Segoe Script', 'Apple Chancery', 'Lucida Handwriting', cursive; text-shadow: 0 0 7px #e2b9ff, 0 0 24px #5c8ef8; pointer-events: none; transition: opacity .3s; }
    .card[data-stage="finale"] .wordmark { opacity: 0; }
    .finale { position: absolute; z-index: 2; inset: auto 16px 7%; text-align: center; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .65s .17s, transform .65s .17s, visibility .65s; pointer-events: none; }
    .card[data-stage="finale"] .finale { opacity: 1; visibility: visible; transform: translateY(0); }
    .finale h2 { margin: 0; color: #fff2d7; font: 600 clamp(27px, 3.7vw, 50px)/1.13 var(--serif); letter-spacing: .08em; text-shadow: 0 0 22px #0b0c14, 0 2px 6px #0b0c14; overflow-wrap: anywhere; }
    .finale-message { margin: 6px auto 0; max-width: 27em; color: #fff1df; font-size: clamp(11px, 1.1vw, 15px); line-height: 1.6; text-shadow: 0 1px 5px #0b0c14, 0 2px 8px #0b0c14; overflow-wrap: anywhere; }
    .footer { min-height: 68px; border-top: 1px solid var(--line); }
    .sequence { display: flex; gap: clamp(12px, 2.4vw, 34px); padding: 0; margin: 0; list-style: none; }
    .sequence li { display: flex; align-items: center; gap: 7px; }
    .sequence li b { font-weight: 500; color: #aa8eb4; }
    .sequence li[aria-current="step"], .sequence li[aria-current="step"] b { color: var(--gold); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 880px) {
      .shell { width: calc(100% - 48px); }
      .card { gap: 26px; grid-template-columns: minmax(260px, .85fr) minmax(0, 1.15fr); }
    }
    @media (max-width: 740px) {
      .shell { width: calc(100% - 36px); }
      .masthead { min-height: 54px; }
      .identity { font-size: 10px; gap: 8px; }
      .identity svg { width: 19px; height: 19px; }
      .edition { font-size: 9px; }
      .card { grid-template-columns: minmax(0, 1fr); gap: 21px; padding-block: 24px 17px; min-height: auto; }
      .eyebrow { margin-bottom: 11px; font-size: 9px; }
      h1 { font-size: clamp(34px, 10.4vw, 58px); }
      .intro { margin-block: 11px 0; font-size: 12px; }
      .copy { display: contents; }
      .lead { grid-row: 1; }
      .stage { grid-row: 2; max-height: 43svh; aspect-ratio: 1.17; }
      .control { grid-row: 3; }
      .terminal { width: 100%; }
      .terminal-head { padding-block: 8px; }
      .command { min-height: 38px; padding-block: 11px; }
      .actions { margin-top: 12px; min-height: 44px; }
      .action { min-height: 44px; }
      .shortcut { display: none; }
      .frame-label.top, .frame-label.right { top: 14px; }
      .frame-label.top, .frame-label.bottom { left: 14px; }
      .frame-label.right { right: 14px; }
      .frame-label.bottom { bottom: 8px; }
      .frame-label.guide { bottom: 8px; right: 14px; }
      .frame-label { font-size: 8px; }
      .wordmark { bottom: max(8%, 22px); }
      .finale { bottom: 9%; }
      .card[data-stage="finale"] #cake-scene { transform: scale(.76); }
      .footer { min-height: 48px; font-size: 9px; }
      .sequence { gap: 10px; }
      .sequence li { gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="identity">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.5c.5 6.6 3.8 9.9 10.5 10.5C15.8 12.6 12.5 15.9 12 22.5 11.4 15.9 8.1 12.6 1.5 12 8.1 11.4 11.4 8.1 12 1.5Z" stroke="currentColor" stroke-width="1.1"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
        BIRTHDAY / SCRIPT
      </div>
      <div class="edition">A GIFT IN ONE LINE</div>
    </header>
    <main class="card" data-stage="ready">
      <div class="copy">
        <div class="lead">
          <p class="eyebrow">FOR YOUR BIRTHDAY</p>
          <h1>一行代码，<span>生辰喜乐。</span></h1>
          <p class="intro" id="dedication">今天有一行特别的代码，等你亲手运行。</p>
        </div>
        <div class="control">
          <div class="terminal" aria-label="生日代码终端">
            <div class="terminal-head"><div class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></div><span>birthday.js</span></div>
            <div class="command"><span class="prompt-symbol" aria-hidden="true">❯</span><code class="code"><span id="code-text"></span><span class="caret" aria-hidden="true"></span></code></div>
          </div>
          <div class="actions">
            <button class="action" data-action="run" type="button">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m5 2.5 8 5.5-8 5.5v-11Z" fill="currentColor"/></svg>运行生日代码
            </button>
            <button class="action" data-action="wish" type="button" hidden>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1c.4 4.4 2.6 6.6 7 7-4.4.4-6.6 2.6-7 7-.4-4.4-2.6-6.6-7-7 4.4-.4 6.6-2.6 7-7Z" fill="currentColor"/></svg>许愿并吹蜡烛
            </button>
            <button class="action replay" data-action="replay" type="button" hidden>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a5.5 5.5 0 1 1 1.6 5M2.5 3v4h4"/></svg>再播放一次
            </button>
            <span class="shortcut"><kbd>Enter</kbd> 确认</span>
          </div>
        </div>
      </div>
      <section class="stage" aria-label="旋转星空蛋糕，可左右拖动，或用左右方向键旋转" tabindex="0">
        <div class="frame-label top"><span class="indicator"></span> GALAXY / CAKE</div>
        <div class="frame-label right">✦ &nbsp; LIVE ORBIT</div>
        <canvas id="cake-scene" aria-hidden="true"></canvas>
        <canvas id="fireworks" aria-hidden="true"></canvas>
        <p class="wordmark" aria-hidden="true">Happy birthday!</p>
        <div class="finale" aria-hidden="true">
          <h2 id="greeting">生辰喜乐</h2>
          <p class="finale-message" id="greeting-message"></p>
        </div>
        <div class="frame-label bottom"><b id="stage-number">01</b> / 03 &nbsp; <span id="stage-label">STANDBY</span></div>
        <div class="frame-label guide" aria-hidden="true">↔ &nbsp; 拖动旋转</div>
      </section>
      <div class="sr-only" role="status" id="status"></div>
    </main>
    <footer class="footer">
      <span>MADE FOR A BIRTHDAY</span>
      <ol class="sequence" aria-label="动画进度">
        <li aria-current="step"><b>01</b> 运行</li><li><b>02</b> 许愿</li><li><b>03</b> 祝福</li>
      </ol>
    </footer>
  </div>
  <script>
    // 改这里可以定制收件人、标题和祝福。留空收件人时使用通用版。
    const gift = {
      recipient: '',
      title: '生辰喜乐',
      message: '愿你新的一岁，有喜欢的事做，有想见的人见，日子常有小欢喜。',
    };

    const card = document.querySelector('[data-stage]');
    const codeText = document.querySelector('#code-text');
    const stageNumber = document.querySelector('#stage-number');
    const stageLabel = document.querySelector('#stage-label');
    const status = document.querySelector('#status');
    const finale = document.querySelector('.finale');
    const steps = [...document.querySelectorAll('.sequence li')];
    const buttons = Object.fromEntries([...document.querySelectorAll('[data-action]')].map(button => [button.dataset.action, button]));
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const command = `birthday.wish(${JSON.stringify(gift.recipient || gift.title)});`;
    const stages = {
      ready: { step: 0, label: 'STANDBY', action: 'run', announcement: '可以运行生日代码。' },
      typing: { step: 0, label: 'RUNNING', action: null, announcement: '正在运行生日代码。' },
      candle: { step: 1, label: 'CANDLE ON', action: 'wish', announcement: '许个愿，再吹蜡烛。' },
      finale: { step: 2, label: 'WISH SENT', action: 'replay', announcement: `${gift.title}。${gift.message}` },
    };

    codeText.textContent = '等待运行';
    document.querySelector('#greeting').textContent = gift.title;
    document.querySelector('#greeting-message').textContent = gift.message;
    if (gift.recipient) {
      document.querySelector('#dedication').textContent = `给${gift.recipient}。今天有一行特别的代码，等你亲手运行。`;
    }

    function setStage(name) {
      const { step, label, action, announcement } = stages[name];
      card.dataset.stage = name;
      stageNumber.textContent = String(step + 1).padStart(2, '0');
      stageLabel.textContent = label;
      steps.forEach((item, index) => {
        if (index === step) item.setAttribute('aria-current', 'step');
        else item.removeAttribute('aria-current');
      });
      Object.entries(buttons).forEach(([key, button]) => { button.hidden = key !== action; });
      finale.setAttribute('aria-hidden', String(name !== 'finale'));
      status.textContent = announcement;
      paintCake();
      if (action) buttons[action].focus({ preventScroll: true });
    }

    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function run() {
      if (!['ready', 'finale'].includes(card.dataset.stage)) return;
      clearFireworks();
      setStage('typing');
      codeText.textContent = '';
      if (!reducedMotion.matches) {
        for (const character of command) {
          codeText.textContent += character;
          await pause(character === '(' ? 150 : 42);
        }
        await pause(220);
      }
      codeText.textContent = command;
      setStage('candle');
    }

    buttons.run.addEventListener('click', run);
    buttons.replay.addEventListener('click', run);
    buttons.wish.addEventListener('click', () => {
      setStage('finale');
      if (!reducedMotion.matches) startFireworks();
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.repeat || document.activeElement !== document.body) return;
      const action = stages[card.dataset.stage].action;
      if (action) buttons[action].click();
    });

    const canvas = document.querySelector('#fireworks');
    const ctx = canvas.getContext('2d');
    const bursts = [
      { time: .47, x: .2, y: .31, scale: .82, hue: '#49e4ff' },
      { time: .62, x: .8, y: .36, scale: 1, hue: '#fa64c9' },
      { time: .98, x: .51, y: .22, scale: 1.14, hue: '#ffd57a' },
      { time: 1.36, x: .29, y: .55, scale: .72, hue: '#a995ff' },
      { time: 1.49, x: .75, y: .61, scale: .65, hue: '#72ffcb' },
      { time: 1.72, x: .53, y: .47, scale: .71, hue: '#ff907d' },
    ];
    let frame = 0;

    function clearFireworks() {
      cancelAnimationFrame(frame);
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function startFireworks() {
      if (!ctx) return;
      const { width, height } = canvas.getBoundingClientRect();
      const density = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * density);
      canvas.height = Math.round(height * density);
      ctx.setTransform(density, 0, 0, density, 0, 0);
      const size = Math.min(width, height);
      const fireworks = bursts.map(burst => {
        const count = size < 390 ? 68 : 108;
        const sparks = Array.from({ length: count }, (_, index) => {
          const ring = index % 3;
          const angle = index * 2.399963 + Math.random() * .14;
          const speed = size * (.13 + ring * .07 + Math.random() * .038) * burst.scale;
          return { vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: .72 + Math.random() * .94, width: .72 + Math.random() * 1.32,
            color: ring === 1 ? '#fff0c9' : burst.hue, flash: Math.random() * 10 };
        });
        return { ...burst, x: burst.x * width, y: burst.y * height, sparks };
      });
      const foil = Array.from({ length: 30 }, (_, index) => ({
        x: Math.random() * width, y: -Math.random() * height * .55,
        phase: Math.random() * Math.PI * 2, speed: 19 + Math.random() * 37,
        size: 2 + Math.random() * 3, color: bursts[index % bursts.length].hue,
      }));
      const start = performance.now();

      function draw(now) {
        const elapsed = (now - start) / 1000;
        ctx.clearRect(0, 0, width, height);
        ctx.lineCap = 'round';
        ctx.globalCompositeOperation = 'lighter';
        for (const burst of fireworks) {
          const age = elapsed - burst.time;
          if (age < -.43 || age > 1.7) continue;
          if (age < 0) {
            const progress = 1 + age / .43;
            const rocketY = height + (burst.y - height) * progress ** .74;
            const rocketX = burst.x + Math.sin(progress * Math.PI) * 12;
            const tail = ctx.createLinearGradient(rocketX, rocketY, rocketX, rocketY + 52);
            tail.addColorStop(0, '#fff4d8');
            tail.addColorStop(.23, burst.hue);
            tail.addColorStop(1, `${burst.hue}00`);
            ctx.globalAlpha = .9;
            ctx.strokeStyle = tail;
            ctx.lineWidth = 2.3;
            ctx.beginPath();
            ctx.moveTo(rocketX, rocketY);
            ctx.quadraticCurveTo(rocketX + 4, rocketY + 22, rocketX + 13, rocketY + 52);
            ctx.stroke();
            continue;
          }
          if (age < .55) {
            const wave = 5 + age * size * burst.scale * .37;
            ctx.globalAlpha = (.55 - age) * .74;
            ctx.strokeStyle = burst.hue;
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.arc(burst.x, burst.y, wave, 0, Math.PI * 2);
            ctx.stroke();
          }
          for (const spark of burst.sparks) {
            if (age > spark.life) continue;
            const behind = Math.max(0, age - .105);
            const travel = 1 - Math.exp(-age * 2.65);
            const previous = 1 - Math.exp(-behind * 2.65);
            const x = burst.x + spark.vx * travel;
            const y = burst.y + spark.vy * travel + size * .13 * age * age;
            ctx.globalAlpha = (1 - age / spark.life) * (.76 + Math.sin(age * 24 + spark.flash) * .22);
            ctx.strokeStyle = spark.color;
            ctx.lineWidth = spark.width;
            ctx.beginPath();
            ctx.moveTo(burst.x + spark.vx * previous, burst.y + spark.vy * previous + size * .13 * behind * behind);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.fillStyle = '#fff6db';
            ctx.fillRect(x, y, 1.4, 1.4);
          }
        }
        ctx.globalCompositeOperation = 'source-over';
        for (const petal of foil) {
          const y = petal.y + elapsed * petal.speed;
          if (y < 0) continue;
          const x = petal.x + Math.sin(elapsed * 2 + petal.phase) * 18;
          ctx.globalAlpha = Math.min(.88, (4.4 - elapsed) * .42);
          ctx.fillStyle = petal.color;
          ctx.beginPath();
          ctx.ellipse(x, y, Math.max(.4, Math.abs(Math.sin(elapsed * 4 + petal.phase)) * petal.size), petal.size * .6, elapsed + petal.phase, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (elapsed < 4.4) frame = requestAnimationFrame(draw);
      }

      frame = requestAnimationFrame(draw);
    }

    const paintCake = (() => {
      const surface = document.querySelector('#cake-scene');
      const scene = surface.getContext('2d');
      if (!scene) return () => {};

      const radius = 125;
      const cakeTop = -3;
      const cakeHeight = 134;
      const tilt = .34;
      const fullTurn = Math.PI * 2;
      const palette = ['#25c6ff', '#2c69ff', '#27efcf', '#ffc62f', '#fff1a5', '#fc58ba', '#f54745', '#c992ff', '#f8f4ff'];
      let seed = 729031;
      function random() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      function ellipse(target, x, y, rx, ry, color) {
        target.fillStyle = color;
        target.beginPath();
        target.ellipse(x, y, rx, ry, 0, 0, fullTurn);
        target.fill();
      }

      function fleck(target, x, y, size, color, angle, points) {
        target.fillStyle = color;
        target.beginPath();
        if (points) {
          for (let index = 0; index < points * 2; index++) {
            const bearing = angle + index * Math.PI / points;
            const reach = index % 2 ? size * .43 : size;
            target.lineTo(x + Math.cos(bearing) * reach, y + Math.sin(bearing) * reach);
          }
        } else {
          target.ellipse(x, y, size, size * .72, angle, 0, fullTurn);
        }
        target.fill();
      }

      function color() { return palette[Math.floor(random() * palette.length)]; }

      function glaze(target, x, y, width, height, hue, opacity) {
        target.save();
        target.translate(x, y);
        target.scale(width, height);
        target.fillStyle = hue;
        target.globalAlpha = opacity;
        target.beginPath();
        target.moveTo(-1, -.22);
        target.bezierCurveTo(-.78, -.81, -.57, .3, -.23, -.36);
        target.bezierCurveTo(.03, -.89, .69, -.74, 1, -.15);
        target.bezierCurveTo(.53, .42, .18, .83, -.08, .51);
        target.bezierCurveTo(-.54, .15, -.72, .54, -1, -.22);
        target.fill();
        target.restore();
      }

      const side = document.createElement('canvas');
      side.width = 1024;
      side.height = 208;
      const wrap = side.getContext('2d');
      const ganache = wrap.createLinearGradient(0, 0, 0, side.height);
      ganache.addColorStop(0, '#4a3565');
      ganache.addColorStop(.24, '#110d25');
      ganache.addColorStop(.62, '#100b22');
      ganache.addColorStop(1, '#142449');
      wrap.fillStyle = ganache;
      wrap.fillRect(0, 0, side.width, side.height);

      // The side texture wraps once around the cake. Repeat marks that cross its seam.
      function aroundCake(x, draw) {
        draw(x);
        if (x < 120) draw(x + side.width);
        if (x > side.width - 120) draw(x - side.width);
      }
      // Each rim decoration has one azimuth shared by its top and its side.
      const rim = [
        { azimuth: .35, color: '#ffb544', length: 48, width: 7 },
        { azimuth: 1.13, color: '#ff71c7', length: 37, width: 6 },
        { azimuth: 1.94, color: '#3fe0ff', length: 48, width: 8 },
        { azimuth: 2.81, color: '#ab8bff', length: 33, width: 7 },
        { azimuth: 3.79, color: '#ffd770', length: 44, width: 7 },
        { azimuth: 4.75, color: '#fc74a4', length: 36, width: 6 },
        { azimuth: 5.58, color: '#4bf1d4', length: 42, width: 8 },
      ];
      const baseColors = ['#0057ca', '#046caa', '#0b9bae', '#3563fa', '#543282', '#09bcdb'];
      for (let i = 0; i < 80; i++) {
        const x = random() * side.width;
        const y = side.height - 15 - random() ** 3 * 107;
        const width = 14 + random() * 72;
        const height = 9 + random() ** 2 * 48;
        aroundCake(x, position => glaze(wrap, position, y, width, height, baseColors[i % baseColors.length], .66));
      }
      for (let i = 0; i < 66; i++) {
        const x = random() * side.width;
        const y = 2 + random() ** 3 * 56;
        const width = 11 + random() * 49;
        const height = 5 + random() * 24;
        const hue = color();
        aroundCake(x, position => glaze(wrap, position, y, width, height, hue, .76));
      }
      for (let i = 0; i < 940; i++) {
        const x = random() * side.width;
        const y = random() * side.height;
        const size = .7 + random() ** 4 * 6;
        const hue = color();
        const angle = random() * fullTurn;
        aroundCake(x, position => fleck(wrap, position, y, size, hue, angle, i % 17 === 0 ? 5 : 0));
      }
      wrap.font = 'italic 22px Georgia, serif';
      wrap.fillStyle = '#fff0d6';
      wrap.textAlign = 'center';
      // Cylinder sampling reads the wrap right to left. Flip the lettering
      // on the texture so it reads normally when projected onto the cake.
      for (const [x, y] of [[815, 121], [311, 141]]) {
        wrap.save();
        wrap.translate(x, y);
        wrap.scale(-1, 1);
        wrap.fillText('Happy Birthday', 0, 0);
        wrap.restore();
      }
      for (const drip of rim) {
        aroundCake(drip.azimuth / fullTurn * side.width, x => {
          const glow = wrap.createLinearGradient(0, 0, 0, drip.length);
          glow.addColorStop(0, '#fff6d5');
          glow.addColorStop(.14, drip.color);
          glow.addColorStop(1, `${drip.color}c4`);
          wrap.fillStyle = glow;
          const width = drip.width * 2.2;
          wrap.beginPath();
          wrap.moveTo(x - width, 0);
          wrap.bezierCurveTo(x - width * .5, 9, x - width * .43, drip.length, x, drip.length);
          wrap.bezierCurveTo(x + width * .48, drip.length, x + width * .54, 7, x + width, 0);
          wrap.fill();
        });
      }

      const top = document.createElement('canvas');
      top.width = top.height = radius * 4;
      const icing = top.getContext('2d');
      icing.translate(radius * 2, radius * 2);
      icing.scale(2, 2);
      const frosting = icing.createRadialGradient(0, 0, 4, 0, 0, radius);
      frosting.addColorStop(0, '#ffe4aa');
      frosting.addColorStop(.63, '#d69c99');
      frosting.addColorStop(1, '#303657');
      ellipse(icing, 0, 0, radius, radius, frosting);
      icing.clip();
      for (let i = 0; i < 235; i++) {
        const bearing = random() * fullTurn;
        const distance = Math.sqrt(random()) * radius;
        const width = 3 + random() ** 2 * 24;
        const height = 3 + random() ** 2 * 17;
        glaze(icing, distance * Math.cos(bearing), distance * Math.sin(bearing), width, height, color(), .7);
      }
      for (let i = 0; i < 230; i++) {
        const bearing = random() * fullTurn;
        const distance = Math.sqrt(random()) * radius;
        fleck(icing, distance * Math.cos(bearing), distance * Math.sin(bearing), 1 + random() ** 2 * 8, color(), bearing, i % 9 === 0 ? 5 : 0);
      }
      for (const drip of rim) {
        icing.save();
        icing.rotate(drip.azimuth);
        ellipse(icing, radius - 3, 0, 14, drip.width * 1.5, drip.color);
        fleck(icing, radius - 13, 0, drip.width + 3, '#fff1be', -.3, 5);
        icing.restore();
      }

      const dust = Array.from({ length: 270 }, (_, i) => {
        const y = random() * 2 - 1;
        return { y, longitude: random() * fullTurn, reach: 115 + Math.sqrt(random()) * 96,
          size: .55 + random() ** 3 * 5.8, hue: color(), points: i % 10 === 0 ? 5 : 0, phase: random() * fullTurn };
      });
      const brightStars = [
        { y: -.53, longitude: .67, reach: 193, size: 12, hue: '#ffe163', points: 5, phase: 2 },
        { y: -.28, longitude: 2.14, reach: 202, size: 14, hue: '#ffc0ef', points: 5, phase: 3 },
        { y: .17, longitude: .36, reach: 193, size: 14, hue: '#ffd65f', points: 5, phase: 1 },
        { y: -.79, longitude: 1.54, reach: 208, size: 9, hue: '#7ccfff', points: 4, phase: 4 },
        { y: .35, longitude: 2.64, reach: 192, size: 11, hue: '#47dfff', points: 5, phase: 2 },
        { y: -.12, longitude: 3.7, reach: 208, size: 12, hue: '#ff718c', points: 5, phase: 0 },
      ];
      dust.push(...brightStars);

      function drawDust(dots, clock, foreground) {
        for (const { star, x, y, z } of dots) {
          if ((z > 0) !== foreground) continue;
          const size = star.size * (1 + z / 820);
          scene.globalAlpha = (foreground ? .87 : .54) * (.85 + .15 * Math.sin(clock * 2 + star.phase));
          if (size > 3.7) {
            const glint = scene.createRadialGradient(x, y, 0, x, y, size * 2.4);
            glint.addColorStop(0, `${star.hue}66`);
            glint.addColorStop(1, `${star.hue}00`);
            ellipse(scene, x, y, size * 2.4, size * 2.4, glint);
          }
          fleck(scene, x, y, size, star.hue, star.phase + clock * .35, star.points);
        }
        scene.globalAlpha = 1;
      }

      const sky = Array.from({ length: 170 }, () => ({
        x: (random() - .5) * 600, y: (random() - .5) * 500,
        size: .25 + random() ** 3 * 1.4, phase: random() * fullTurn,
      }));
      const orbits = [
        { tilt: -.64, height: 82, speed: .89, phase: .16, hue: '#6be7ff' },
        { tilt: .56, height: 109, speed: -.73, phase: 2.24, hue: '#ff79d5' },
        { tilt: -.09, height: 155, speed: .53, phase: 4.1, hue: '#ffd78a' },
      ];

      function drawSky(clock) {
        for (const [x, y, rx, ry, angle, hue] of [
          [-96, -76, 232, 119, -.63, '#3f54d7'],
          [87, -62, 212, 107, .61, '#a333a5'],
          [0, 66, 247, 98, -.19, '#266b93'],
        ]) {
          scene.save();
          scene.translate(x, y);
          scene.rotate(angle);
          scene.scale(rx, ry);
          const cloud = scene.createRadialGradient(0, 0, 0, 0, 0, 1);
          cloud.addColorStop(0, `${hue}66`);
          cloud.addColorStop(.4, `${hue}37`);
          cloud.addColorStop(1, `${hue}00`);
          ellipse(scene, 0, 0, 1, 1, cloud);
          scene.restore();
        }
        for (const star of sky) {
          scene.globalAlpha = .25 + .23 * Math.cos(clock * 1.1 + star.phase);
          ellipse(scene, star.x, star.y, star.size, star.size, '#d9dcff');
        }
        scene.globalAlpha = 1;
        for (const [offset, x, y, hue] of [[.37, 155, -182, '#83e7ff'], [2.82, -28, -184, '#ff9bdd']]) {
          const step = (clock + offset) % 5.3;
          if (step > .95) continue;
          const headX = x - step * 163;
          const headY = y + step * 87;
          const meteor = scene.createLinearGradient(headX, headY, headX + 88, headY - 47);
          meteor.addColorStop(0, '#fff5e5');
          meteor.addColorStop(.22, hue);
          meteor.addColorStop(1, `${hue}00`);
          scene.globalAlpha = Math.sin(step / .95 * Math.PI) * .91;
          scene.strokeStyle = meteor;
          scene.lineWidth = 2;
          scene.beginPath();
          scene.moveTo(headX, headY);
          scene.lineTo(headX + 88, headY - 47);
          scene.stroke();
          scene.globalAlpha = 1;
        }
      }

      function orbitPoint(orbit, angle) {
        const x = Math.cos(angle) * 210;
        const y = Math.sin(angle) * orbit.height;
        const cos = Math.cos(orbit.tilt);
        const sin = Math.sin(orbit.tilt);
        return { x: x * cos - y * sin, y: x * sin + y * cos - 33, front: y > 0 };
      }

      function drawOrbits(clock, foreground) {
        scene.save();
        scene.globalCompositeOperation = 'lighter';
        scene.lineCap = 'round';
        for (const orbit of orbits) {
          scene.strokeStyle = `${orbit.hue}32`;
          scene.lineWidth = .86;
          scene.beginPath();
          for (let i = 0; i <= 36; i++) {
            const point = orbitPoint(orbit, (foreground ? 0 : Math.PI) + i * Math.PI / 36);
            scene.lineTo(point.x, point.y);
          }
          scene.stroke();

          const headAngle = orbit.phase + clock * orbit.speed;
          const head = orbitPoint(orbit, headAngle);
          scene.strokeStyle = orbit.hue;
          for (let i = 0; i < 22; i++) {
            const a = orbitPoint(orbit, headAngle - Math.sign(orbit.speed) * i * .057);
            const b = orbitPoint(orbit, headAngle - Math.sign(orbit.speed) * (i + 1) * .057);
            if (a.front !== foreground) continue;
            const energy = (1 - i / 22) ** 2;
            scene.globalAlpha = energy * .13;
            scene.lineWidth = 11 * energy + 2;
            scene.beginPath();
            scene.moveTo(a.x, a.y);
            scene.lineTo(b.x, b.y);
            scene.stroke();
            scene.globalAlpha = energy * .92;
            scene.lineWidth = 1 + energy * 2;
            scene.stroke();
          }
          if (head.front === foreground) {
            scene.globalAlpha = .95;
            const flare = scene.createRadialGradient(head.x, head.y, 1, head.x, head.y, 24);
            flare.addColorStop(0, orbit.hue);
            flare.addColorStop(.28, `${orbit.hue}60`);
            flare.addColorStop(1, `${orbit.hue}00`);
            ellipse(scene, head.x, head.y, 24, 24, flare);
            fleck(scene, head.x, head.y, 7.5, '#fff8e4', 0, 4);
          }
          scene.globalAlpha = 1;
        }
        scene.restore();
      }

      function drawCake(angle, clock) {
        ellipse(scene, 0, 158, 194, 50, '#070b16');
        ellipse(scene, 0, 154, 185, 49, '#2589d2');
        ellipse(scene, 0, 149, 185, 48, '#ebefff');
        const plate = scene.createLinearGradient(-170, 170, 136, 108);
        plate.addColorStop(0, '#aab8ea');
        plate.addColorStop(.55, '#d9e6ff');
        plate.addColorStop(1, '#fff3db');
        ellipse(scene, 0, 148, 177, 43, plate);
        ellipse(scene, 0, 144, 139, 40, '#293d7190');

        // The visible point is (sin(curve), cos(curve)) in the same X/Z plane
        // as the icing. Inverse-rotate that azimuth into the cake's texture.
        for (let x = -radius; x < radius; x += 1) {
          const curve = Math.asin((x + .5) / radius);
          const azimuth = Math.PI / 2 - curve - angle;
          const source = ((azimuth / fullTurn % 1 + 1) % 1) * side.width;
          const y = cakeTop + Math.cos(curve) * radius * tilt;
          scene.drawImage(side, Math.floor(source), 0, 1, side.height, x, y, 1.15, cakeHeight);
          const gleam = Math.exp(-(((x - 81) / 21) ** 2)) * .19 + Math.exp(-(((x + 89) / 19) ** 2)) * .16;
          scene.fillStyle = `rgba(101, 182, 255, ${gleam})`;
          scene.fillRect(x, y, 1.15, cakeHeight);
        }

        scene.save();
        scene.translate(0, cakeTop);
        scene.scale(1, tilt);
        scene.rotate(angle);
        scene.drawImage(top, -radius, -radius, radius * 2, radius * 2);
        scene.restore();
        scene.strokeStyle = '#fff5d585';
        scene.lineWidth = 1.1;
        scene.beginPath();
        scene.ellipse(0, cakeTop, radius - 1, radius * tilt - 1, 0, -.2, 2.55);
        scene.stroke();

        const wax = scene.createLinearGradient(-6, 0, 6, 0);
        wax.addColorStop(0, '#9f631c');
        wax.addColorStop(.46, '#ffd778');
        wax.addColorStop(.8, '#fff0ad');
        wax.addColorStop(1, '#d58724');
        ellipse(scene, 0, cakeTop + 4, 11, 4, '#55354796');
        scene.fillStyle = wax;
        scene.beginPath();
        scene.roundRect(-5, -113, 10, 114, 3);
        scene.fill();
        scene.strokeStyle = '#5b463a';
        scene.beginPath();
        scene.moveTo(0, -112);
        scene.lineTo(0, -121);
        scene.stroke();

        if (card.dataset.stage === 'finale') return;
        const flicker = Math.sin(clock * 12) * 2 + Math.sin(clock * 18) * 1.2;
        const aura = scene.createRadialGradient(0, -138, 1, 0, -138, 61);
        aura.addColorStop(0, '#ffcf6dbd');
        aura.addColorStop(.33, '#ff9b323c');
        aura.addColorStop(1, '#ff9b3200');
        ellipse(scene, 0, -138, 61, 61, aura);
        const fire = scene.createLinearGradient(0, -179, 0, -122);
        fire.addColorStop(0, '#6da3f5');
        fire.addColorStop(.38, '#f7fdff');
        fire.addColorStop(.74, '#fff2b0');
        fire.addColorStop(1, '#ffac38');
        scene.fillStyle = fire;
        scene.beginPath();
        scene.moveTo(flicker, -181 - flicker);
        scene.bezierCurveTo(3, -152, 17 + flicker, -145, 11, -131);
        scene.bezierCurveTo(5, -117, -9, -119, -12, -136);
        scene.bezierCurveTo(-13, -148, -3, -163, flicker, -181 - flicker);
        scene.fill();
      }

      const stage = surface.closest('.stage');
      let width, height, density;
      let turn = .33;
      let drag = null;
      function render(time) {
        const clock = (time - started) / 1000;
        scene.setTransform(density, 0, 0, density, 0, 0);
        scene.clearRect(0, 0, width, height);
        scene.translate(width / 2, height * .447);
        const zoom = Math.min(width / 500, height / 493);
        scene.scale(zoom, zoom);
        drawSky(clock);

        const dots = dust.map(star => {
          const longitude = star.longitude + clock * .44;
          const horizontal = Math.sqrt(1 - star.y ** 2) * star.reach;
          const z = Math.sin(longitude) * horizontal;
          return { star, z, x: Math.cos(longitude) * horizontal, y: star.y * star.reach * .91 + z * .21 - 22 };
        });
        drawOrbits(clock, false);
        drawDust(dots, clock, false);
        drawCake(turn, clock);
        drawDust(dots, clock, true);
        drawOrbits(clock, true);
      }

      const started = performance.now();
      let animation = 0;
      let previous = started;
      function frame(time) {
        if (!drag) turn = (turn + Math.min(.05, Math.max(0, (time - previous) / 1000)) * .71) % fullTurn;
        previous = time;
        render(time);
        animation = requestAnimationFrame(frame);
      }
      function paint() {
        render(reducedMotion.matches ? started : performance.now());
      }
      function resize() {
        width = surface.clientWidth;
        height = surface.clientHeight;
        density = Math.min(window.devicePixelRatio || 1, 2);
        surface.width = Math.round(width * density);
        surface.height = Math.round(height * density);
        paint();
      }
      function syncMotion() {
        cancelAnimationFrame(animation);
        previous = performance.now();
        paint();
        if (!reducedMotion.matches && !document.hidden) animation = requestAnimationFrame(frame);
      }

      stage.addEventListener('pointerdown', event => {
        if (event.button !== 0 || drag) return;
        drag = { id: event.pointerId, x: event.clientX };
        stage.setPointerCapture(event.pointerId);
        stage.dataset.dragging = '';
      });
      stage.addEventListener('pointermove', event => {
        if (drag?.id !== event.pointerId) return;
        turn = (turn - (event.clientX - drag.x) * .016) % fullTurn;
        drag.x = event.clientX;
        paint();
      });
      stage.addEventListener('lostpointercapture', event => {
        if (drag?.id !== event.pointerId) return;
        drag = null;
        delete stage.dataset.dragging;
      });
      stage.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        turn = (turn + (event.key === 'ArrowLeft' ? .21 : -.21)) % fullTurn;
        paint();
      });

      new ResizeObserver(resize).observe(surface);
      reducedMotion.addEventListener('change', syncMotion);
      document.addEventListener('visibilitychange', syncMotion);
      resize();
      syncMotion();
      return paint;
    })();
  </script>
</body>
</html>
